<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · CAPSULE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter, sans-serif; background:#f8fafc; display:flex;
           align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .error-card { background:#fff; border-radius:16px; padding:48px 40px; text-align:center;
                  max-width:440px; width:100%; box-shadow:0 8px 40px rgba(0,0,0,.08); }
    .error-code { font-size:5rem; font-weight:900; background:linear-gradient(135deg,#2563eb,#7c3aed);
                  -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; }
    .error-icon { font-size:3rem; color:#2563eb; margin:16px 0; opacity:.7; display:block; }
    h1 { font-size:1.5rem; font-weight:800; color:#1e293b; margin-bottom:8px; }
    p  { color:#64748b; font-size:.9rem; line-height:1.6; margin-bottom:28px; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:11px 24px;
           border-radius:8px; font-weight:600; font-size:.875rem; text-decoration:none;
           background:#2563eb; color:#fff; transition:background .2s; }
    .btn:hover { background:#1d4ed8; }
    .btn-outline { background:#fff; color:#2563eb; border:1.5px solid #2563eb; margin-left:8px; }
    .btn-outline:hover { background:#eff6ff; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <i class="fa-solid fa-magnifying-glass-minus error-icon"></i>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.<br>
       Check the URL or navigate back to CAPSULE.</p>
    <div>
      <a href="/" class="btn"><i class="fa-solid fa-house"></i> Home</a>
      <a href="javascript:history.back()" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Go Back</a>
    </div>
  </div>
</body>
</html>
